services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: unicore-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - unicore-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - unicore-net

  redis:
    image: redis:8-alpine
    container_name: unicore-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - unicore-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: unicore-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - unicore-net

  # Applies the EF Core migrations, then exits. The API starts only after it finished successfully.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    container_name: unicore-migrate
    depends_on:
      sqlserver:
        condition: service_healthy
    command: ["--connection", "Server=sqlserver,1433;Database=UniCore;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"]
    restart: "no"
    networks:
      - unicore-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unicore-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=UniCore;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      PasswordReset__Pepper: ${PASSWORD_RESET_PEPPER}
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD},abortConnect=false"
      Redis__InstanceName: "unicore:"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Proxy__TrustedNetworks__0: "172.16.0.0/12"
      Smtp__Host: mailpit
      Smtp__Port: 1025
      Smtp__UseSsl: "false"
      Smtp__FromAddress: "noreply@unicore.local"
      Smtp__FromName: "UniCore"
      AllowedHosts: "localhost"
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL:-admin@unicore.local}
      SeedAdmin__UserName: ${SEED_ADMIN_USERNAME:-superadmin}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:-Admin_P@ssw0rd!1}
      Hangfire__DashboardEnabled: "false"
    networks:
      - unicore-net

volumes:
  unicore-sqlserver-data:

networks:
  unicore-net:
    driver: bridge