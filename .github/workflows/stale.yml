name: Stale Issues and PRs

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark stale issues and pull requests
        uses: actions/stale@v9
        with:
          stale-issue-message: "This issue has been marked as stale due to inactivity. It will be closed if no further activity occurs."
          stale-pr-message: "This pull request has been marked as stale due to inactivity. It will be closed if no further activity occurs."
          close-issue-message: "Closing this issue due to prolonged inactivity."
          close-pr-message: "Closing this pull request due to prolonged inactivity."
          days-before-stale: 30
          days-before-close: 7
          exempt-issue-labels: "pinned,security"
          exempt-pr-labels: "pinned,security"
