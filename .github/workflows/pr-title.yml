# Enforces Conventional Commit style PR titles (feat:, fix:, docs:, ...),
# which keeps history readable and makes changelogs automatable.

name: PR Title

on:
  pull_request:
    types: [ opened, edited, synchronize, reopened ]
    branches: [ "master" ]

permissions:
  pull-requests: read

jobs:
  semantic-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            security
