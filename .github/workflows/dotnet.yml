# UniCore CI pipeline
# Gates: build → unit-tests → architecture-tests → integration-tests → vuln-scan → docker-build
name: .NET

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # ─────────────────────────────────────────────
  # 1. Restore + Build
  # ─────────────────────────────────────────────
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/bin/Release/
            **/obj/
          retention-days: 1

  # ─────────────────────────────────────────────
  # 2. Unit Tests
  # ─────────────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Run unit tests
        run: dotnet test UniCore.UnitTests -c Release --no-build --logger "trx;LogFileName=unit-results.trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ./TestResults/*.trx
          retention-days: 30

  # ─────────────────────────────────────────────
  # 3. Architecture Tests (includes NoThrowTests)
  # ─────────────────────────────────────────────
  architecture-tests:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Run architecture tests
        run: dotnet test UniCore.ArchitectureTests -c Release --no-build --logger "trx;LogFileName=arch-results.trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-test-results
          path: ./TestResults/*.trx
          retention-days: 30

  # ─────────────────────────────────────────────
  # 4. Integration Tests (SQL Server + Redis)
  # ─────────────────────────────────────────────
  integration-tests:
    runs-on: ubuntu-24.04
    needs: build

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CI_Test#Passw0rd!2026"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'CI_Test#Passw0rd!2026' -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping | grep PONG || exit 1"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    env:
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=UniCoreCI;User Id=sa;Password=CI_Test#Passw0rd!2026;TrustServerCertificate=True"
      Redis__ConnectionString: "localhost:6379,abortConnect=false"
      Jwt__SigningKey: "ci-test-signing-key-ci-test-signing-key-0123456789"
      PasswordReset__Pepper: "ci-test-pepper-ci-test-pepper-0123456789"
      PasswordReset__ResendCooldownSeconds: "0"
      SeedAdmin__UserName: "admin"
      SeedAdmin__Email: "admin@test.local"
      SeedAdmin__Password: "CIAdmin#2026xK9!"
      RateLimiting__Disabled: "true"

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Run integration tests
        run: dotnet test UniCore.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration-results.trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ./TestResults/*.trx
          retention-days: 30

  # ─────────────────────────────────────────────
  # 5. Vulnerable package scan
  # ─────────────────────────────────────────────
  vuln-scan:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Check for vulnerable packages
        run: |
          OUTPUT=$(dotnet list package --vulnerable --include-transitive 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qiE '(High|Critical)'; then
            echo "::error::High or Critical vulnerability found in dependencies"
            exit 1
          fi

  # ─────────────────────────────────────────────
  # 6. Docker build smoke test
  # ─────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-24.04
    needs: [unit-tests, architecture-tests]
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t unicore-api:ci-${{ github.sha }} .

      # Builds the migrations bundle the compose stack runs before the API (the `migrations` target).
      - name: Build migrations bundle image
        run: docker build --target migrations -t unicore-migrations:ci-${{ github.sha }} .

      - name: Verify no secrets in image layers
        run: |
          docker history unicore-api:ci-${{ github.sha }} --no-trunc --format '{{.CreatedBy}}' | \
            grep -ivE '(password|secret|key|pepper|token)' || \
            echo "Layer check passed"
