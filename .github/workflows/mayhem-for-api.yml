# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
#
# This workflow starts your API and fuzzes it with ForAllSecure Mayhem for API
# to find reliability, performance and security issues before they reach
# production.
#
# To use this workflow, you will need to:
#
# 1. Create a Mayhem account at https://app.mayhem.security
#
# 2. Create an API token at https://app.mayhem.security/-/settings/user/api-tokens
#
# 3. Add the API token as a secret in GitHub called "MAYHEM_TOKEN"
#
# 4. Update the "Start your API" step to run your API in the background before
#    starting the Mayhem for API scan, and update the `api-url` & `api-spec`
#    field.
#
# If you have any questions, please contact us at mayhem4api@forallsecure.com

name: "Mayhem for API"

on:
  push:
    branches: [ "master" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "master" ]

jobs:
  mayhem-for-api:
    name: Mayhem for API
    # Mayhem for API runs on linux, mac and windows
    runs-on: ubuntu-latest
    env:
      MAYHEM_TOKEN: ${{ secrets.MAYHEM_TOKEN }}
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        if: ${{ env.MAYHEM_TOKEN != '' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Run your API in the background. Ideally, the API would run in debug
      # mode & send stacktraces back on "500 Internal Server Error" responses
      # (don't do this in production though!)
      - name: Start your API
        if: ${{ env.MAYHEM_TOKEN != '' }}
        run: ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://127.0.0.1:8080 dotnet run --project ./UniCore.Api/UniCore.Api.csproj --no-launch-profile &

      - name: Wait for API startup
        if: ${{ env.MAYHEM_TOKEN != '' }}
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/openapi/v1.json >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in time."
          exit 1

      - name: Skip Mayhem scan (missing token)
        if: ${{ env.MAYHEM_TOKEN == '' }}
        run: echo "::notice::Skipping Mayhem for API scan because MAYHEM_TOKEN is not configured."

      - name: Mayhem for API
        uses: ForAllSecure/mapi-action@v1
        if: ${{ env.MAYHEM_TOKEN != '' }}
        continue-on-error: true
        with:
          mayhem-token: ${{ env.MAYHEM_TOKEN }}
          api-url: http://127.0.0.1:8080
          api-spec: http://127.0.0.1:8080/openapi/v1.json
          duration: 60
          sarif-report: mapi.sarif

      - name: Upload SARIF file
        if: ${{ always() && hashFiles('mapi.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: mapi.sarif
