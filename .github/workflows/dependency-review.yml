name: Dependency Review

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check dependency graph availability
        id: dependency-graph
        uses: actions/github-script@v7
        with:
          script: |
            const { data: repo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const status = repo.security_and_analysis?.dependency_graph?.status ?? "disabled";
            core.info(`Dependency graph status: ${status}`);
            core.setOutput("enabled", status === "enabled" ? "true" : "false");

      - name: Review dependency changes
        if: steps.dependency-graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Dependency review skipped
        if: steps.dependency-graph.outputs.enabled != 'true'
        run: echo "::notice title=Dependency review skipped::Dependency graph is disabled for this repository. Enable it in repository settings to run dependency review checks."
